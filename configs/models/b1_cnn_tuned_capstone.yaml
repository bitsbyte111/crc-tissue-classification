experiment:
  name: B1_cnn_tuned
  output_dir: runs
  seed: 42
  deterministic: true
  device: auto
data:
  root: data
  source_dirs:
  - data
  size: 28
  download: true
  in_memory: auto
  num_workers: 0
  eval_batch_size: 512
  subset_fraction: 1.0
  synthetic: false
  synthetic_samples: 512
augment:
  enabled: true
  flips: true
  rot90: true
  color_jitter: 0.0
  hed_jitter: 0.0
model:
  name: simple_cnn
  input_size: null
  normalization: dataset
  pretrained: true
  weights_file: null
  params:
    base_channels: 32
    depth: 3
    kernel_size: 3
    convs_per_block: 1
    activation: relu
    batch_norm: true
    pooling: max
    head: gap
    dropout: 0.0
    init: kaiming
train:
  epochs: 15
  batch_size: 32
  optimizer: adam
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.0
  class_weights: false
  grad_clip: null
  amp: true
  data_parallel: false
  early_stopping_patience: 4
  monitor: val_macro_f1
  save_checkpoint: best
  resume: true
  finetune:
    strategy: full
    trainable_fraction: 0.25
    layer_decay: null
eval:
  test: true
  bootstrap: 1000
  save_predictions: true
